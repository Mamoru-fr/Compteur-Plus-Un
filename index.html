<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Compteur +1</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%2360a5fa'%3E%2B1%3C/text%3E%3C/svg%3E" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: #0a0a0a;
        color: #fafafa;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      #tapzone {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        cursor: pointer;
        transition: background 80ms ease;
      }
      #tapzone:active { background: #111827; }
      #counter {
        font-size: clamp(96px, 30vw, 200px);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: -0.04em;
        transition: transform 60ms ease, color 60ms ease;
      }
      #counter.pop { transform: scale(1.06); color: #60a5fa; }
      #label {
        font-size: 15px;
        color: #6b7280;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-weight: 600;
      }
      #hint {
        position: fixed;
        bottom: calc(110px + env(safe-area-inset-bottom));
        left: 0; right: 0;
        text-align: center;
        font-size: 13px;
        color: #4b5563;
        pointer-events: none;
        padding: 0 24px;
      }
      #controls {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
        justify-content: center;
        background: linear-gradient(to top, rgba(10,10,10,0.95), rgba(10,10,10,0.7), transparent);
      }
      button {
        flex: 1;
        max-width: 180px;
        padding: 14px 20px;
        border-radius: 14px;
        border: 1px solid #1f2937;
        background: #111827;
        color: #e5e7eb;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { background: #1d4ed8; border-color: #1d4ed8; }
      #reset { color: #f87171; border-color: #3f1d20; }
      #undo { color: #fbbf24; border-color: #3a2a12; }
    </style>
  </head>
  <body>
    <div id="tapzone">
      <div id="counter">0</div>
      <div id="label">appuyez pour compter</div>
    </div>
    <div id="hint">Écran entier tactile &middot; touches Volume &#177; au clavier</div>
    <div id="controls">
      <button id="undo">&#8722;1</button>
      <button id="reset">Remettre à zéro</button>
    </div>
    <script>
      const counterEl = document.getElementById("counter");
      const tapzone = document.getElementById("tapzone");
      const KEY = "compteur-valeur";
      let count = parseInt(localStorage.getItem(KEY) || "0", 10) || 0;

      function render() {
        counterEl.textContent = count;
        try { localStorage.setItem(KEY, count); } catch (e) {}
      }

      function buzz() {
        if (navigator.vibrate) navigator.vibrate(8); // Android / Chrome
      }

      function increment() {
        count++;
        render();
        buzz();
        counterEl.classList.add("pop");
        setTimeout(() => counterEl.classList.remove("pop"), 70);
      }

      function undo() { if (count > 0) { count--; render(); } }
      function reset() { count = 0; render(); }

      tapzone.addEventListener("pointerdown", (e) => {
        if (e.target.closest("#controls")) return;
        increment();
      });

      document.getElementById("undo").addEventListener("click", undo);
      document.getElementById("reset").addEventListener("click", reset);

      // Clavier : les touches de volume d'un clavier incrémentent
      document.addEventListener("keydown", (e) => {
        if (e.key === "VolumeUp" || e.key === "VolumeDown") { e.preventDefault(); increment(); }
        else if (e.key === "Backspace") { e.preventDefault(); undo(); }
        else if (e.key === "r" || e.key === "R") reset();
        else if (e.key === " ") { e.preventDefault(); increment(); }
      });

      render();
    </script>
  </body>
</html>
